name: Check narrow Serde adapters

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  serde-adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test string and map serialization adapters
        run: |
          cargo test --locked --manifest-path crates/tor-chanmgr/Cargo.toml --features pt-client
          cargo test --locked --manifest-path crates/tor-linkspec/Cargo.toml --features pt-client
          cargo test --locked --manifest-path crates/tor-netdoc/Cargo.toml
          cargo test --locked --manifest-path crates/tor-protover/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/tor-protover/Cargo.toml --features serde
          cargo test --locked --manifest-path crates/tor-hsservice/Cargo.toml --features restricted-discovery,tor-rtcompat/tokio,tor-rtcompat/rustls
      - name: Reject unused weak adapter dependencies in a fresh wallet
        run: |
          python3 maint/zakura/check-client-graph.py --forbid \
            iana-time-zone iana-time-zone-haiku jiff-tzdb jiff-tzdb-platform \
            schemars ref-cast ref-cast-impl windows-core windows-implement \
            windows-interface windows-result windows-strings
