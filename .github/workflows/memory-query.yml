name: Check memory queries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-query:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.workflow }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Test memory quotas and native memory oracle
        run: cargo test --locked --manifest-path crates/tor-memquota/Cargo.toml
      - name: Test native Windows configuration paths
        if: matrix.os == 'windows-2022'
        run: cargo test --locked --manifest-path crates/tor-config-path/Cargo.toml --all-features
      - name: Check BSD memory-query bindings
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup target add x86_64-unknown-freebsd x86_64-unknown-netbsd
          cargo check --locked --manifest-path crates/tor-memquota/Cargo.toml --lib --no-default-features --target x86_64-unknown-freebsd
          cargo check --locked --manifest-path crates/tor-memquota/Cargo.toml --lib --no-default-features --target x86_64-unknown-netbsd
