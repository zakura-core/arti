name: Check RSA DER encoding
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rsa-der:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --check --edition 2024 maint/zakura/probes/rsa-der.rs
      - name: Verify RSA and certificate parsing
        run: cargo test --locked --manifest-path crates/tor-llcrypto/Cargo.toml
      - name: Compare the previous DER serializer
        run: python3 maint/zakura/check-rsa-der.py
      - name: Check the fresh embedded client
        run: python3 maint/zakura/check-client-graph.py --forbid cookie-factory
