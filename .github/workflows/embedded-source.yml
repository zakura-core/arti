name: Verify embedded libraries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.workflow }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check retained sources and formatting
        run: |
          python3 maint/zakura/check-embedded-source.py
          cargo fmt --all -- --check
      - name: Check the retained library workspace
        run: cargo check --workspace --locked
      - name: Run core library tests
        run: |
          cargo test --locked --manifest-path crates/fs-mistrust/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/fs-mistrust/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-llcrypto/Cargo.toml
          cargo test --locked --manifest-path crates/tor-cert/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-keymgr/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/tor-keymgr/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-persist/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-rtcompat/Cargo.toml \
            --no-default-features --features tokio,rustls,tls-server,testing
          cargo test --locked --manifest-path crates/tor-rtcompat/Cargo.toml \
            --no-default-features --features tokio,async-std,smol,rustls,tls-server,testing
      - name: Test configuration feature boundaries
        run: |
          cargo test --locked --manifest-path crates/tor-config/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/tor-config/Cargo.toml --no-default-features --features file-watcher
          cargo test --locked --manifest-path crates/tor-config/Cargo.toml
          cargo test --locked --manifest-path crates/tor-config-path/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/tor-config-path/Cargo.toml --all-features
      - name: Test wallet client and optional protocol implementations
        run: |
          cargo test --locked --manifest-path crates/arti-client/Cargo.toml --no-default-features --features tokio,rustls,onion-service-client
          cargo test --locked --manifest-path crates/arti-client/Cargo.toml --no-default-features --features tokio,rustls,onion-service-client,keymgr,experimental-api
          cargo test --locked --manifest-path crates/tor-circmgr/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-netdoc/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-netdir/Cargo.toml --all-features
          cargo test --locked --manifest-path crates/tor-chanmgr/Cargo.toml --features pt-client
          cargo test --locked --manifest-path crates/tor-linkspec/Cargo.toml --features pt-client
          cargo test --locked --manifest-path crates/tor-protover/Cargo.toml --features serde
      - name: Check fresh wallet feature graph
        run: |
          python3 maint/zakura/check-client-graph.py \
            --forbid glob-match sysinfo url idna idna_adapter figment toml serde_ignored pear uncased async_executors blanket native-tls async-native-tls schannel security-framework --forbid-icu
      - name: Exercise the public Tor network
        if: matrix.os == 'ubuntu-24.04' && github.event_name != 'pull_request'
        run: |
          cargo test --locked --manifest-path crates/arti-client/Cargo.toml \
            --no-default-features --features tokio,rustls,onion-service-client \
            --test live_tor public_tor_bootstrap_and_https_request -- --ignored --exact --nocapture
