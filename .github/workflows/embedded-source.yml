name: Check embedded source
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  embedded-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python3 maint/zakura/check-embedded-source.py
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --locked --manifest-path crates/arti-client/Cargo.toml --no-default-features --features tokio,rustls,onion-service-client
