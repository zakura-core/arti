name: Check relay nickname storage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nickname:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
          key: ${{ github.workflow }}
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check maint/zakura/nickname-compat.rs
      - name: Test document parsing and nickname compatibility
        run: |
          cargo test --locked --manifest-path crates/tor-netdoc/Cargo.toml
          cargo test --locked --manifest-path crates/tor-netdoc/Cargo.toml --all-features
          python3 maint/zakura/check-nickname-compat.py
          python3 maint/zakura/check-client-graph.py --forbid tinystr zerovec zerofrom
