name: Check numeric proxy URIs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ github.workflow }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate feature boundaries
        run: |
          cargo test --locked --manifest-path crates/tor-chanmgr/Cargo.toml
          cargo test --locked --manifest-path crates/tor-chanmgr/Cargo.toml --features pt-client
          python3 maint/zakura/check-client-graph.py --forbid url idna idna_adapter --forbid-icu
