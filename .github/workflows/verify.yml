name: Verify Zakura Arti

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  embedded-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check fork identities and formatting
        run: |
          python3 maint/zakura/check-package-family.py
          python3 maint/zakura/check-embedded-source.py
          cargo fmt --all -- --check
      - name: Test configuration with and without watching
        run: |
          cargo test --locked --manifest-path crates/tor-config/Cargo.toml --no-default-features
          cargo test --locked --manifest-path crates/tor-config/Cargo.toml
      - name: Check guard-state provenance
        run: cargo test --locked --manifest-path crates/tor-guardmgr/Cargo.toml crate_id
      - name: Check embedded Tor and onion-service client
        run: |
          cargo check --locked --manifest-path crates/arti-client/Cargo.toml --no-default-features \
            --features tokio,rustls,onion-service-client
