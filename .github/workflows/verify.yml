name: Verify Zakura Arti

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  embedded-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check fork identities and formatting
        run: |
          python3 maint/zakura/check-package-family.py
          cargo fmt --all -- --check
      - name: Test configuration loading and watching independently
        run: |
          cargo test --locked -p zakura-tor-config --no-default-features
          cargo test --locked -p zakura-tor-config --no-default-features --features load-config
          cargo test --locked -p zakura-tor-config --no-default-features --features file-watcher
          cargo test --locked -p zakura-tor-config
          cargo test --locked -p zakura-tor-config-path
      - name: Check guard-state provenance
        run: cargo test --locked -p zakura-tor-guardmgr crate_id
      - name: Check embedded Tor and onion-service client
        run: python3 maint/zakura/check-client-graph.py
      - name: Test proxy URI parsing and legacy oracle
        run: cargo test --locked -p zakura-tor-chanmgr

  memory-query:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test memory quotas and native memory oracle
        run: cargo test --locked -p zakura-tor-memquota
      - name: Check BSD memory-query bindings
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup target add x86_64-unknown-freebsd x86_64-unknown-netbsd
          cargo check --locked -p zakura-tor-memquota --lib --no-default-features --target x86_64-unknown-freebsd
          cargo check --locked -p zakura-tor-memquota --lib --no-default-features --target x86_64-unknown-netbsd
