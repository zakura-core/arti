[package]
name = "hyper-examples"
version = "0.2.0"
authors = ["The Tor Project, Inc.", "Ramid Khan <ramidzkh@gmail.com>", "Niel Duysters"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Examples demonstrating the usage of Arti with hyper"
publish = false

[features]
full = [
    "arti-client/full",
    "safelog/full",
    "tor-cell/full",
    "tor-hsservice/full",
    "tor-proto/full",
]

[dependencies]
anyhow = "1.0.104"
arti-client = { path = "../../crates/arti-client", version = "0.47.0-zakura.1", features = ["onion-service-service"], package = "zakura-arti-client" }
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
safelog = { path = "../../crates/safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-native-tls = "0.3.1"
tokio-util = "0.7.20"
tor-cell = { path = "../../crates/tor-cell", version = "0.47.0-zakura.1", package = "zakura-tor-cell" }
tor-hsservice = { path = "../../crates/tor-hsservice", version = "0.47.0-zakura.1", package = "zakura-tor-hsservice" }
tor-proto = { path = "../../crates/tor-proto", version = "0.47.0-zakura.1", package = "zakura-tor-proto" }
tracing-subscriber = "0.3.23"
