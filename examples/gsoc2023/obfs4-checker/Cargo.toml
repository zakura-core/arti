[package]
name = "obfs4-checker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
arti-client = { path = "../../../crates/arti-client", version = "0.47.0-zakura.1", features = ["bridge-client", "pt-client", "experimental-api"], package = "zakura-arti-client" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
futures = "0.3.34"
serde = "1.0.229"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54", features = ["full"] }
tor-chanmgr = { path = "../../../crates/tor-chanmgr", version = "0.47.0-zakura.1", features = ["pt-client", "experimental-api"], package = "zakura-tor-chanmgr" }
tor-error = { path = "../../../crates/tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-guardmgr = { path = "../../../crates/tor-guardmgr", version = "0.47.0-zakura.1", features = ["full"], package = "zakura-tor-guardmgr" }
tor-proto = { path = "../../../crates/tor-proto", version = "0.47.0-zakura.1", features = [], package = "zakura-tor-proto" }
tor-rtcompat = { path = "../../../crates/tor-rtcompat", version = "0.47.0-zakura.1", package = "zakura-tor-rtcompat" }
tracing-subscriber = "0.3.23"
web-time-compat = { path = "../../../crates/web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }

[features]
full = [
    "arti-client/full",
    "tor-chanmgr/full",
    "tor-error/full",
    "tor-guardmgr/full",
    "tor-proto/full",
    "tor-rtcompat/full",
    "web-time-compat/full",
]
