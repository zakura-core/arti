[package]
name = "connection-checker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
arti-client = { path = "../../../crates/arti-client", version = "0.47.0-zakura.1", features = [ "bridge-client", "pt-client", "experimental-api" ], package = "zakura-arti-client" }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
tokio = { version = "1.54", features = ["full"] }
tor-error = { path = "../../../crates/tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-proto = { path = "../../../crates/tor-proto", version = "0.47.0-zakura.1", features = ["experimental-api", "stream-ctrl"], package = "zakura-tor-proto" }
tor-rtcompat = { path = "../../../crates/tor-rtcompat", version = "0.47.0-zakura.1", package = "zakura-tor-rtcompat" }
tracing = "0.1"
tracing-subscriber = "0.3.23"

[features]
full = ["arti-client/full", "tor-error/full", "tor-rtcompat/full", "tor-proto/full"]
