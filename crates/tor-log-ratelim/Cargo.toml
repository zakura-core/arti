[package]
name = "zakura-tor-log-ratelim"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc."]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Facility for rate-limiting log messages in Arti"
keywords = ["tor", "arti", "async"]
categories = ["asynchronous"]
repository = "https://github.com/zakura-core/arti"

[features]

default = []
full = ["tor-error/full", "tor-rtcompat/full", "web-time-compat/full"]

[dependencies]

futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
humantime = "2"
thiserror = "2"
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1" }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1" }
tracing = "0.1.44"
weak-table = "0.4.0"
web-time-compat = { package = "zakura-web-time-compat", path = "../web-time-compat", version = "0.3.0-zakura.1" }

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_log_ratelim"
