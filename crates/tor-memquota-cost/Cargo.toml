[package]
name = "zakura-tor-memquota-cost"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Ian Jackson <iwj@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Low-level memory tracking traits, for use by Arti"
keywords = ["tor", "arti"]
categories = ["memory-management"]
repository = "https://github.com/zakura-core/arti"

[features]
full = ["memquota"]
default = []
memquota = []

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
itertools = "0.15.0"
paste = "1.0.15"
void = "1"

[dev-dependencies]
safelog = { package = "zakura-safelog", path = "../safelog", version = "0.10.0-zakura.1" }
serde_json = "1.0.154"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_memquota_cost"
