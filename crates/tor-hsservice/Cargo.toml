[package]
name = "zakura-tor-hsservice"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Arti's implementation of an onion service provider"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://github.com/zakura-core/arti"
#
# We need a PreferredRuntime
# @@ test-all-crates conditional-option minimal --features=tor-rtcompat/tokio,tor-rtcompat/native-tls

[features]
default = []
restricted-discovery = []

metrics = ["dep:metrics", "__is_experimental"]

# Onion service proof of work schemes
hs-pow-full = [
    "tor-hscrypto/hs-pow-full",
    "tor-netdoc/hs-pow-full",
    "tor-cell/hs-pow-full",
    "arrayvec",
    "equix",
    "num-traits",
    "tor-checkable",
    "__is_experimental",
]

full = [
    "restricted-discovery",
    "fs-mistrust/full",
    "oneshot-fused-workaround/full",
    "retry-error/full",
    "safelog/full",
    "tor-async-utils/full",
    "tor-basic-utils/full",
    "tor-bytes/full",
    "tor-cell/full",
    "tor-checkable?/full",
    "tor-circmgr/full",
    "tor-config-path/full",
    "tor-config/full",
    "tor-dirclient/full",
    "tor-error/full",
    "tor-hscrypto/full",
    "tor-key-forge/full",
    "tor-keymgr/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-log-ratelim/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-persist/full",
    "tor-proto/full",
    "tor-protover/full",
    "tor-relay-selection/full",
    "tor-rtcompat/full",
    "equix?/full",
    "web-time-compat/full",
]

# Enable experimental APIs that are not yet officially supported.
#
# These APIs are not covered by semantic versioning.  Using this
# feature voids your "semver warrantee".
experimental = [
    "experimental-api",
    "hs-pow-full",
    "metrics",
    "negotiate-extensions",
    "onion-service-cli-extra",
]
experimental-api = ["__is_experimental"]

onion-service-cli-extra = ["tor-keymgr/onion-service-cli-extra", "__is_experimental"]

negotiate-extensions = ["__is_experimental"]

__is_experimental = []

[dependencies]
amplify = { version = "4", default-features = false, features = ["derive"] }
arrayvec = { version = "0.7.8", features = ["serde"], optional = true }
async-trait = "0.1.92"
base64ct = "1.8.3"
cfg-if = "1.0.5"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_builder = { version = "0.11.2", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
digest = "0.10.7"
educe = "0.4.23"
equix = { path = "../equix", version = "0.8.0-zakura.1", optional = true, package = "zakura-equix" }
fs-mistrust = { path = "../fs-mistrust", version = "0.16.0-zakura.1", features = ["serde"], package = "zakura-fs-mistrust" }
futures = "0.3.34"
growable-bloom-filter = "2.1.1"
hex = "0.4"
humantime = "2"
itertools = "0.15.0"
k12 = "0.3.0"
metrics = { version = "0.24.6", optional = true }
num-traits = { version = "0.2.19", optional = true }
once_cell = "1"
oneshot-fused-workaround = { path = "../oneshot-fused-workaround", version = "0.8.0-zakura.1", package = "zakura-oneshot-fused-workaround" }
postage = { version = "0.5.0", default-features = false, features = ["futures-traits"] }
rand = "0.10.3"
rand_core = "0.10.1"
retry-error = { version = "0.14.0-zakura.1", path = "../retry-error", package = "zakura-retry-error" }
safelog = { path = "../safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tor-async-utils = { path = "../tor-async-utils", version = "0.47.0-zakura.1", package = "zakura-tor-async-utils" }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-bytes = { version = "0.47.0-zakura.1", path = "../tor-bytes", package = "zakura-tor-bytes" }
tor-cell = { version = "0.47.0-zakura.1", path = "../tor-cell", features = ["hs"], package = "zakura-tor-cell" }
tor-checkable = { version = "0.47.0-zakura.1", path = "../tor-checkable", optional = true, package = "zakura-tor-checkable" }
tor-circmgr = { version = "0.47.0-zakura.1", path = "../tor-circmgr", features = ["hs-service", "send-control-msg"], package = "zakura-tor-circmgr" }
tor-config = { version = "0.47.0-zakura.1", path = "../tor-config", default-features = false, features = ["file-watcher"], package = "zakura-tor-config" }
tor-config-path = { version = "0.47.0-zakura.1", path = "../tor-config-path", package = "zakura-tor-config-path" }
tor-dirclient = { path = "../tor-dirclient", version = "0.47.0-zakura.1", default-features = false, features = ["hs-service"], package = "zakura-tor-dirclient" }
tor-error = { version = "0.47.0-zakura.1", path = "../tor-error", package = "zakura-tor-error" }
tor-hscrypto = { version = "0.47.0-zakura.1", path = "../tor-hscrypto", features = ["ope"], package = "zakura-tor-hscrypto" }
tor-keymgr = { version = "0.47.0-zakura.1", path = "../tor-keymgr", features = ["keymgr"], package = "zakura-tor-keymgr" }
tor-linkspec = { version = "0.47.0-zakura.1", path = "../tor-linkspec", features = ["verbatim", "decode"], package = "zakura-tor-linkspec" }
tor-llcrypto = { version = "0.47.0-zakura.1", path = "../tor-llcrypto", package = "zakura-tor-llcrypto" }
tor-log-ratelim = { path = "../tor-log-ratelim", version = "0.47.0-zakura.1", package = "zakura-tor-log-ratelim" }
tor-netdir = { version = "0.47.0-zakura.1", path = "../tor-netdir", features = ["hs-service"], package = "zakura-tor-netdir" }
tor-netdoc = { version = "0.47.0-zakura.1", path = "../tor-netdoc", features = ["hs-service"], package = "zakura-tor-netdoc" }
tor-persist = { version = "0.47.0-zakura.1", path = "../tor-persist", features = ["state-dir"], package = "zakura-tor-persist" }
tor-proto = { package = "zakura-tor-proto", version = "0.47.0-zakura.1", path = "../tor-proto", features = [
    "experimental-api",
    "hs-service",
    "send-control-msg",
] }
tor-protover = { version = "0.47.0-zakura.1", path = "../tor-protover", package = "zakura-tor-protover" }
tor-relay-selection = { path = "../tor-relay-selection", version = "0.47.0-zakura.1", package = "zakura-tor-relay-selection" }
tor-rtcompat = { version = "0.47.0-zakura.1", path = "../tor-rtcompat", package = "zakura-tor-rtcompat" }
tracing = "0.1.44"
void = "1"
web-time-compat = { version = "0.3.0-zakura.1", path = "../web-time-compat", package = "zakura-web-time-compat" }

[dev-dependencies]
libc = { version = "0.2", default-features = false }
rmp-serde = "1"
serde_json = "1.0.154"
slotmap-careful = { path = "../slotmap-careful", version = "0.9.0-zakura.1", package = "zakura-slotmap-careful" }
tempfile = "3"
test-temp-dir = { version = "0.9.0-zakura.1", path = "../test-temp-dir", package = "zakura-test-temp-dir" }
tor-config = { version = "0.47.0-zakura.1", path = "../tor-config", features = ["file-watcher", "testing"], default-features = false, package = "zakura-tor-config" }
tor-key-forge = { version = "0.47.0-zakura.1", path = "../tor-key-forge", package = "zakura-tor-key-forge" }
tor-keymgr = { version = "0.47.0-zakura.1", path = "../tor-keymgr", features = ["keymgr", "testing"], package = "zakura-tor-keymgr" }
tor-llcrypto = { version = "0.47.0-zakura.1", path = "../tor-llcrypto", features = ["testing"], package = "zakura-tor-llcrypto" }
tor-netdir = { version = "0.47.0-zakura.1", path = "../tor-netdir", features = ["hs-service", "testing"], package = "zakura-tor-netdir" }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0-zakura.1", features = ["testing"], package = "zakura-tor-netdoc" }
tor-persist = { version = "0.47.0-zakura.1", path = "../tor-persist", features = ["testing"], package = "zakura-tor-persist" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0-zakura.1", package = "zakura-tor-rtmock" }
tracing-test = "0.2.6"
walkdir = "2"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_hsservice"
