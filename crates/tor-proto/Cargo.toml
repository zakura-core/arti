[package]
name = "zakura-tor-proto"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Asynchronous client-side implementation of the central Tor network protocols"
keywords = ["tor", "arti", "networking", "anonymity"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/zakura-core/arti"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
full = [
    "hs-client",
    "hs-service",
    "pt-client",
    "tokio",
    "rpc",
    "send-control-msg",
    "stream-ctrl",
    "safelog/full",
    "tor-async-utils/full",
    "tor-basic-utils/full",
    "tor-bytes/full",
    "tor-cell/full",
    "tor-cert/full",
    "tor-checkable/full",
    "tor-config/full",
    "tor-error/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-rtcompat/full",
    "tor-rtmock?/full",
    "tor-units/full",
    "tor-hscrypto?/full",
    "tor-log-ratelim/full",
    "oneshot-fused-workaround/full",
    "tor-memquota/full",
    "slotmap-careful/full",
    "caret/full",
    "tor-protover/full",
    "tor-relay-crypto/full",
    "web-time-compat/full",
    "tor-relay-crypto?/full",
    "tor-rpcbase?/full",
]

experimental = [
    "experimental-api",
    "conflux",
    "testing",
    "bench",
    "relay",
    "circ-padding",
    "circ-padding-manual",
]
conflux = ["tor-cell/conflux", "__is_experimental"]
pt-client = ["tor-linkspec/pt-client"]

hs-client = ["hs-common"]
hs-service = ["hs-common"]
hs-common = ["tor-hscrypto"]
experimental-api = ["__is_experimental"]
# start_conversation etc.; TODO HS should be renamed
send-control-msg = []
stream-ctrl = []
circ-padding = ["__is_experimental", "maybenot", "rand09"]
circ-padding-manual = ["__is_experimental", "circ-padding"]
relay = [
    "tor-cert/x509",
    "tor-linkspec/decode",
    "tor-relay-crypto",
    "__is_experimental",
]
rpc = ["stream-ctrl", "dep:tor-rpcbase", "dep:serde"]

# Enable testing-only APIs.  APIs under this feature are not
# covered by semver.
testing = ["__is_experimental", "dep:tor-rtmock"]
tokio = ["tokio-crate", "tokio-util", "tor-async-utils/tokio"]
bench = ["__is_experimental"]
__is_experimental = []

[dependencies]
aes = { version = "0.9" }
async-trait = "0.1.92"
asynchronous-codec = "0.7.0"
bitvec = "1.1.1"
bytes = "1"
caret = { path = "../caret", version = "0.11.0-zakura.1", package = "zakura-caret" }
cfg-if = "1.0.5"
cipher = { version = "0.5.2", features = ["zeroize"] }
coarsetime = "0.1.38"
ctr = { version = "0.10", features = ["zeroize"] }
derive-deftly = "~1.14.0"
derive_builder = { version = "0.11.2", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
digest = "0.10.7"
educe = "0.4.23"
enum_dispatch = "0.3.13"
futures = "0.3.34"
futures-util = "0.3.34"
getset = "0.1.7"
hkdf = "0.12.4"
hmac = "0.12.1"
itertools = "0.15.0"
maybenot = { version = "2.2.2", optional = true }
nonany = "0.3"
oneshot-fused-workaround = { path = "../oneshot-fused-workaround", version = "0.8.0-zakura.1", package = "zakura-oneshot-fused-workaround" }
pin-project = "1"
polyval = { version = "0.7" }
rand = "0.10.3"
rand09 = { package = "rand", version = "0.9", optional = true }
rand_core = "0.10.1"
safelog = { path = "../safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
slotmap-careful = { path = "../slotmap-careful", version = "0.9.0-zakura.1", package = "zakura-slotmap-careful" }
smallvec = { version = "1.16", features = ["const_generics"] }
static_assertions = "1"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2"
thiserror = "2"
tokio-crate = { package = "tokio", version = "1.54.1", optional = true }
tokio-util = { version = "0.7.20", features = ["compat"], optional = true }
tor-async-utils = { package = "zakura-tor-async-utils", path = "../tor-async-utils", version = "0.47.0-zakura.1" }
tor-basic-utils = { package = "zakura-tor-basic-utils", path = "../tor-basic-utils", version = "0.47.0-zakura.1" }
tor-bytes = { package = "zakura-tor-bytes", path = "../tor-bytes", version = "0.47.0-zakura.1" }
tor-cell = { package = "zakura-tor-cell", path = "../tor-cell", version = "0.47.0-zakura.1", features = ["relay"] }
tor-cert = { package = "zakura-tor-cert", path = "../tor-cert", version = "0.47.0-zakura.1" }
tor-checkable = { package = "zakura-tor-checkable", path = "../tor-checkable", version = "0.47.0-zakura.1" }
tor-config = { package = "zakura-tor-config", path = "../tor-config", version = "0.47.0-zakura.1", default-features = false }
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1" }
tor-hscrypto = { package = "zakura-tor-hscrypto", default-features = false, path = "../tor-hscrypto", version = "0.47.0-zakura.1", features = ["memquota-memcost"], optional = true }
tor-linkspec = { package = "zakura-tor-linkspec", path = "../tor-linkspec", version = "0.47.0-zakura.1" }
tor-llcrypto = { package = "zakura-tor-llcrypto", path = "../tor-llcrypto", version = "0.47.0-zakura.1", features = ["memquota-memcost"] }
tor-log-ratelim = { package = "zakura-tor-log-ratelim", path = "../tor-log-ratelim", version = "0.47.0-zakura.1" }
tor-memquota = { package = "zakura-tor-memquota", version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false }
tor-protover = { package = "zakura-tor-protover", version = "0.47.0-zakura.1", path = "../tor-protover" }
tor-relay-crypto = { package = "zakura-tor-relay-crypto", version = "0.47.0-zakura.1", path = "../tor-relay-crypto", optional = true }
tor-rpcbase = { package = "zakura-tor-rpcbase", version = "0.47.0-zakura.1", path = "../tor-rpcbase", optional = true }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1" }
tor-rtmock = { package = "zakura-tor-rtmock", path = "../tor-rtmock", version = "0.47.0-zakura.1", optional = true }
tor-units = { package = "zakura-tor-units", path = "../tor-units", version = "0.47.0-zakura.1", features = ["memquota-memcost"] }
tracing = "0.1.44"
typenum = "1.20"
visibility = { version = "0.1.1" }
void = "1"
web-time-compat = { path = "../web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }
zeroize = "1"

[dev-dependencies]
assert_matches = "1.5.0"
criterion = "0.8.2"
hex = "0.4"
hex-literal = "1.1"
humantime = "2"
itertools = "0.15.0"
regex = { version = "1", default-features = false, features = ["std"] }
statrs = { version = "0.19.1", default-features = false }
tokio-crate = { package = "tokio", version = "1.54.1", features = ["full"] }
tor-key-forge = { path = "../tor-key-forge", version = "0.47.0-zakura.1", package = "zakura-tor-key-forge" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", features = ["testing"], package = "zakura-tor-llcrypto" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0-zakura.1", features = ["tokio", "native-tls"], package = "zakura-tor-rtcompat" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0-zakura.1", package = "zakura-tor-rtmock" }
tracing-test = "0.2.6"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dev-dependencies]
criterion-cycles-per-byte = "0.8.0"

[[bench]]
name = "client_decrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "client_encrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "exit_decrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "exit_encrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "relay_decrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "relay_encrypt"
harness = false
required-features = ["bench"]

[[bench]]
name = "tor1_is_recognized"
harness = false
required-features = ["bench"]

[[bench]]
name = "tor1_set_digest"
harness = false
required-features = ["bench"]

[lib]
name = "tor_proto"
