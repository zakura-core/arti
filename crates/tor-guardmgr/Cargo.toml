[package]
name = "zakura-tor-guardmgr"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Manage a set of guard relays for Tor network"
keywords = ["tor", "arti", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
full = [
    "vanguards",
    "safelog/full",
    "tor-basic-utils/full",
    "tor-config/full",
    "tor-error/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-persist/full",
    "tor-proto/full",
    "tor-rtcompat/full",
    "tor-units/full",
    "tor-async-utils/full",
    "tor-relay-selection/full",
    "tor-rtmock?/full",
    "tor-dircommon/full",
    "web-time-compat/full",
]
experimental = ["testing"]

# Vanguards support
vanguards = ["tor-relay-selection/vanguards"]

# Enable testing-only APIs.  APIs under this feature are not
# covered by semver.
testing = [
    "tor-netdir/testing",
    "tor-persist/testing",
    "tor-rtmock",
    "__is_experimental",
]

__is_experimental = []

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
educe = "0.4.23"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
getset = "0.1.7"
humantime = "2"
humantime-serde = "1.1.1"
itertools = "0.15.0"
pin-project = "1"
rand = "0.10.3"
safelog = { package = "zakura-safelog", path = "../safelog", version = "0.10.0-zakura.1" }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tor-async-utils = { package = "zakura-tor-async-utils", version = "0.47.0-zakura.1", path = "../tor-async-utils" }
tor-basic-utils = { package = "zakura-tor-basic-utils", path = "../tor-basic-utils", version = "0.47.0-zakura.1" }
tor-config = { package = "zakura-tor-config", path = "../tor-config", version = "0.47.0-zakura.1", default-features = false }
tor-dircommon = { package = "zakura-tor-dircommon", path = "../tor-dircommon", version = "0.47.0-zakura.1" }
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1" }
tor-linkspec = { package = "zakura-tor-linkspec", path = "../tor-linkspec", version = "0.47.0-zakura.1" }
tor-llcrypto = { package = "zakura-tor-llcrypto", path = "../tor-llcrypto", version = "0.47.0-zakura.1" }
tor-netdir = { package = "zakura-tor-netdir", path = "../tor-netdir", version = "0.47.0-zakura.1" }
tor-netdoc = { package = "zakura-tor-netdoc", path = "../tor-netdoc", version = "0.47.0-zakura.1" }                              # for address pattern
tor-persist = { package = "zakura-tor-persist", path = "../tor-persist", version = "0.47.0-zakura.1" }
tor-proto = { package = "zakura-tor-proto", path = "../tor-proto", version = "0.47.0-zakura.1" }
tor-relay-selection = { package = "zakura-tor-relay-selection", path = "../tor-relay-selection", version = "0.47.0-zakura.1" }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1" }
tor-rtmock = { package = "zakura-tor-rtmock", path = "../tor-rtmock", version = "0.47.0-zakura.1", optional = true }
tor-units = { package = "zakura-tor-units", path = "../tor-units", version = "0.47.0-zakura.1" }
tracing = "0.1.44"
web-time-compat = { package = "zakura-web-time-compat", path = "../web-time-compat", version = "0.3.0-zakura.1" }

[dev-dependencies]
float_eq = "1.0.1"
fs-mistrust = { package = "zakura-fs-mistrust", path = "../fs-mistrust", version = "0.16.0-zakura.1" }
serde_json = "1.0.154"
tempfile = "3"
toml = "1.1.8"
tor-netdir = { package = "zakura-tor-netdir", path = "../tor-netdir", version = "0.47.0-zakura.1", features = ["testing"] }
tor-netdoc = { package = "zakura-tor-netdoc", path = "../tor-netdoc", version = "0.47.0-zakura.1" }
tor-persist = { package = "zakura-tor-persist", path = "../tor-persist", version = "0.47.0-zakura.1", features = ["testing"] }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1", features = ["tokio", "rustls"] }
tor-rtmock = { package = "zakura-tor-rtmock", path = "../tor-rtmock", version = "0.47.0-zakura.1" }

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_guardmgr"
