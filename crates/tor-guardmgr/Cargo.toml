[package]
name = "tor-guardmgr"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Manage a set of guard relays for Tor network"
keywords = ["tor", "arti", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[features]
default = []
full = [
    "vanguards",
    "safelog/full",
    "tor-basic-utils/full",
    "tor-config/full",
    "tor-error/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-persist/full",
    "tor-proto/full",
    "tor-rtcompat/full",
    "tor-units/full",
    "tor-async-utils/full",
    "tor-relay-selection/full",
    "tor-rtmock?/full",
    "oneshot-fused-workaround/full",
    "tor-dircommon/full",
    "web-time-compat/full",
]
experimental = ["testing"]

# Vanguards support
vanguards = ["tor-relay-selection/vanguards"]

# Enable testing-only APIs.  APIs under this feature are not
# covered by semver.
testing = [
    "tor-netdir/testing",
    "tor-persist/testing",
    "tor-rtmock",
    "__is_experimental",
]

__is_experimental = []

[dependencies]
base64ct = "1.8.3"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_builder = { version = "0.11", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
dyn-clone = "1.0.20"
educe = "0.4.23"
futures = "0.3.34"
getset = "0.1.7"
humantime = "2"
humantime-serde = "1.1.1"
itertools = "0.15.0"
oneshot-fused-workaround = { path = "../oneshot-fused-workaround", version = "0.8.0" }
pin-project = "1"
rand = "0.10.3"
safelog = { path = "../safelog", version = "0.10.0" }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tor-async-utils = { version = "0.47.0", path = "../tor-async-utils" }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
tor-config = { path = "../tor-config", version = "0.47.0", default-features = false }
tor-dircommon = { path = "../tor-dircommon", version = "0.47.0" }
tor-error = { path = "../tor-error", version = "0.47.0" }
tor-linkspec = { path = "../tor-linkspec", version = "0.47.0" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0" }
tor-netdir = { path = "../tor-netdir", version = "0.47.0" }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0" }                              # for address pattern
tor-persist = { path = "../tor-persist", version = "0.47.0" }
tor-proto = { path = "../tor-proto", version = "0.47.0" }
tor-relay-selection = { path = "../tor-relay-selection", version = "0.47.0" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0", optional = true }
tor-units = { path = "../tor-units", version = "0.47.0" }
tracing = "0.1.44"
web-time-compat = { path = "../web-time-compat", version = "0.3.0" }

[dev-dependencies]
float_eq = "1.0.1"
fs-mistrust = { path = "../fs-mistrust", version = "0.16.0" }
serde_json = "1.0.154"
tempfile = "3"
toml = "1.1.8"
tor-netdir = { path = "../tor-netdir", version = "0.47.0", features = ["testing"] }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0" }
tor-persist = { path = "../tor-persist", version = "0.47.0", features = ["testing"] }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0", features = ["tokio", "rustls"] }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0" }

[package.metadata.docs.rs]
all-features = true
