[package]
name = "tor-rtmock"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Testing mock support for tor-rtcomapt"
keywords = ["tor", "arti", "async", "testing"]
categories = ["asynchronous"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[dependencies]
assert_matches = "1.5.0"
async-trait = "0.1.92"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
educe = "0.4.23"
futures = "0.3.34"
humantime = "2"
itertools = "0.15.0"
pin-project = "1"
priority-queue = "2.7.0"
slotmap-careful = { path = "../slotmap-careful", version = "0.9.0" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
tor-error = { version = "0.47.0", path = "../tor-error", features = ["tracing"] }
tor-rtcompat = { version = "0.47.0", path = "../tor-rtcompat" }
tracing = "0.1.44"
void = "1"
web-time-compat = { version = "0.3.0", path = "../web-time-compat" }

[dev-dependencies]
futures-await-test = "0.3.0"
rand = "0.10.3"
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0", features = ["tokio", "rustls"] }
tracing-test = "0.2.6"

[features]
full = [
    "tor-basic-utils/full",
    "tor-rtcompat/full",
    "tor-error/full",
    "slotmap-careful/full",
    "web-time-compat/full",
]
[package.metadata.docs.rs]
all-features = true
