[package]
name = "zakura-tor-rtcompat"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Compatibility layer for asynchronous runtimes, used by Tor"
keywords = ["tor", "arti", "async"]
categories = ["asynchronous"]
repository = "https://github.com/zakura-core/arti"
[package.metadata.docs.rs]
all-features = true

[features]

default = []
full = [
    "arbitrary",
    "async-std",
    "tokio",
    "rustls",
    "tls-server",
    "tor-error/full",
    "tor-general-addr/full",
    "tor-cert-x509?/full",
    "web-time-compat/full",
]

experimental = ["smol", "testing"]
__is_experimental = []

async-std = ["async-std-crate", "async-io", "dep:async_executors", "async_executors/async_std"]
tokio = ["tokio-crate", "tokio-util"]
smol = ["dep:smol", "async-io", "blocking", "__is_experimental"]
testing = ["__is_experimental"]

# TLS backend used by the embedded wallet runtime.
rustls = [
    "futures-rustls",
    "dep:rustls-dont-use",
    "rustls-pki-types",
    "rustls-webpki",
    "__is_nonadditive",
]

# Build with TLS server support, if possible.
tls-server = ["tor-cert-x509"]

__is_nonadditive = []

[dependencies]
arbitrary = { version = "1.5.0", optional = true, features = ["derive"] }
async-io = { version = "2.6.0", optional = true }
async-std-crate = { package = "async-std", version = "1.13.2", optional = true }
async-trait = "0.1.92"
async_executors = { version = "0.7.0", default-features = false, optional = true }
asynchronous-codec = "0.7.0"
blocking = { version = "1.7.0", optional = true }
cfg-if = "1.0.5"
coarsetime = "0.1.38"
derive_builder = { version = "0.11", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
dyn-clone = "1.0.20"
educe = "0.4.23"
futures = "0.3.34"
futures-rustls = { version = "0.26.0", optional = true, default-features = false, features = [
    "tls12",
    "logging",
    "ring",
] }

getset = "0.1.7"
hex = "0.4.3"

paste = "1.0.15"
pin-project = "1"
# We access the rustls library through the `futures_rustls::rustls` re-export,
# but we still rely on specific rustls features which became available in a version later than
# futures_rustls' minimum rustls version (for example `ServerCertVerifier::root_hint_subjects`).
# So we need to specify our own minimum version of rustls,
# and we rename it so that we continue to use rustls from only the futures_rustls re-export.
rustls-dont-use = { package = "rustls", version = "0.23.46", default-features = false, optional = true }
rustls-pki-types = { version = "1.15", optional = true }
rustls-webpki = { version = "0.103.16", optional = true }
smol = { version = "2.0.2", optional = true }
thiserror = "2"
tokio-crate = { package = "tokio", version = "1.54.1", optional = true, features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["compat"], optional = true }
tor-cert-x509 = { package = "zakura-tor-cert-x509", version = "0.47.0-zakura.1", path = "../tor-cert-x509", optional = true }
tor-error = { package = "zakura-tor-error", version = "0.47.0-zakura.1", path = "../tor-error", features = ["tracing"] }
tor-general-addr = { package = "zakura-tor-general-addr", version = "0.47.0-zakura.1", path = "../tor-general-addr" }
tracing = "0.1.44"
void = "1"
web-time-compat = { package = "zakura-web-time-compat", version = "0.3.0-zakura.1", path = "../web-time-compat" }
zeroize = "1"

[target.'cfg(not(all(target_arch="wasm32", target_os="unknown")))'.dependencies]
socket2 = "0.6.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_matches = "1.5.0"
tor-basic-utils = { package = "zakura-tor-basic-utils", version = "0.47.0-zakura.1", path = "../tor-basic-utils" }

[lib]
name = "tor_rtcompat"
