[package]
name = "zakura-tor-circmgr"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Manage a set of anonymous circuits over the Tor network"
keywords = ["tor", "arti", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[features]

default = []
full = [
    "hs-client",
    "hs-service",
    "specific-relay",
    "vanguards",
    "safelog/full",
    "send-control-msg",
    "tor-basic-utils/full",
    "tor-cell/full",
    "tor-chanmgr/full",
    "tor-config/full",
    "tor-error/full",
    "tor-guardmgr/full",
    "tor-linkspec/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-persist/full",
    "tor-proto/full",
    "tor-rtcompat/full",
    "tor-async-utils/full",
    "tor-protover/full",
    "tor-relay-selection/full",
    "tor-memquota/full",
    "tor-units/full",
    "tor-dircommon/full",
    "web-time-compat/full",
]
specific-relay = []
vanguards = ["tor-guardmgr/vanguards"]

# Enable testing-only APIs.  APIs under this feature are not
# covered by semver.
testing = ["tor-guardmgr/testing", "__is_experimental"]

# Enable experimental APIs that are not yet officially supported.
#
# These APIs are not covered by semantic versioning.  Using this
# feature voids your "semver warrantee".
experimental = ["experimental-api", "testing", "conflux"]
conflux = ["__is_experimental", "tor-proto/conflux"]
experimental-api = ["visibility", "__is_experimental"]
send-control-msg = ["tor-proto/send-control-msg"]
hs-client = ["hs-common"]
hs-service = ["hs-common", "tor-proto/hs-service"]
hs-common = []
__is_experimental = []

[dependencies]
async-trait = "0.1.92"
cfg-if = "1.0.5"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
dyn-clone = "1.0.20"
educe = "0.4.23"
futures = "0.3.34"
getset = "0.1.7"
humantime-serde = "1.1.1"
itertools = "0.15.0"
once_cell = "1"
pin-project = "1"
rand = "0.10.3"
safelog = { package = "zakura-safelog", path = "../safelog", version = "0.10.0-zakura.1" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tor-async-utils = { package = "zakura-tor-async-utils", version = "0.47.0-zakura.1", path = "../tor-async-utils" }
tor-basic-utils = { package = "zakura-tor-basic-utils", path = "../tor-basic-utils", version = "0.47.0-zakura.1" }
tor-cell = { package = "zakura-tor-cell", path = "../tor-cell", version = "0.47.0-zakura.1" }
tor-chanmgr = { package = "zakura-tor-chanmgr", path = "../tor-chanmgr", version = "0.47.0-zakura.1" }
tor-config = { package = "zakura-tor-config", path = "../tor-config", version = "0.47.0-zakura.1", default-features = false }
tor-dircommon = { package = "zakura-tor-dircommon", path = "../tor-dircommon", version = "0.47.0-zakura.1" }
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1", features = ["tracing"] }
tor-guardmgr = { package = "zakura-tor-guardmgr", path = "../tor-guardmgr", version = "0.47.0-zakura.1" }
tor-linkspec = { package = "zakura-tor-linkspec", path = "../tor-linkspec", version = "0.47.0-zakura.1" }
tor-memquota = { package = "zakura-tor-memquota", version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false }
tor-netdir = { package = "zakura-tor-netdir", path = "../tor-netdir", version = "0.47.0-zakura.1" }
tor-netdoc = { package = "zakura-tor-netdoc", path = "../tor-netdoc", version = "0.47.0-zakura.1" }
tor-persist = { package = "zakura-tor-persist", path = "../tor-persist", version = "0.47.0-zakura.1" }
tor-proto = { package = "zakura-tor-proto", path = "../tor-proto", version = "0.47.0-zakura.1" }
tor-protover = { package = "zakura-tor-protover", path = "../tor-protover", version = "0.47.0-zakura.1" }
tor-relay-selection = { package = "zakura-tor-relay-selection", path = "../tor-relay-selection", version = "0.47.0-zakura.1" }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1" }
tor-units = { package = "zakura-tor-units", path = "../tor-units", version = "0.47.0-zakura.1" }
tracing = "0.1.44"
visibility = { version = "0.1.1", optional = true }
weak-table = "0.4.0"
web-time-compat = { package = "zakura-web-time-compat", path = "../web-time-compat", version = "0.3.0-zakura.1" }

[dev-dependencies]
futures-await-test = "0.3.0"
hex = "0.4"
tor-guardmgr = { package = "zakura-tor-guardmgr", path = "../tor-guardmgr", version = "0.47.0-zakura.1", features = ["testing", "vanguards"] }
tor-llcrypto = { package = "zakura-tor-llcrypto", path = "../tor-llcrypto", version = "0.47.0-zakura.1" }
tor-netdir = { package = "zakura-tor-netdir", path = "../tor-netdir", version = "0.47.0-zakura.1", features = ["testing"] }
tor-persist = { package = "zakura-tor-persist", path = "../tor-persist", version = "0.47.0-zakura.1", features = ["testing"] }
tor-rtcompat = { package = "zakura-tor-rtcompat", path = "../tor-rtcompat", version = "0.47.0-zakura.1", features = ["tokio", "rustls"] }
tor-rtmock = { package = "zakura-tor-rtmock", path = "../tor-rtmock", version = "0.47.0-zakura.1" }
[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_circmgr"
