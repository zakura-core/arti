[package]
name = "zakura-tor-circmgr"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Manage a set of anonymous circuits over the Tor network"
keywords = ["tor", "arti", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/zakura-core/arti"

[features]

default = []
full = [
    "hs-client",
    "hs-service",
    "specific-relay",
    "vanguards",
    "retry-error/full",
    "safelog/full",
    "send-control-msg",
    "tor-basic-utils/full",
    "tor-cell/full",
    "tor-chanmgr/full",
    "tor-config/full",
    "tor-error/full",
    "tor-guardmgr/full",
    "tor-linkspec/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-persist/full",
    "tor-proto/full",
    "tor-rtcompat/full",
    "tor-geoip?/full",
    "tor-async-utils/full",
    "tor-protover/full",
    "tor-relay-selection/full",
    "oneshot-fused-workaround/full",
    "tor-memquota/full",
    "tor-units/full",
    "tor-dircommon/full",
    "web-time-compat/full",
]
specific-relay = []
vanguards = ["tor-guardmgr/vanguards"]

# Enable testing-only APIs.  APIs under this feature are not
# covered by semver.
testing = ["tor-guardmgr/testing", "__is_experimental"]

# Enable experimental APIs that are not yet officially supported.
#
# These APIs are not covered by semantic versioning.  Using this
# feature voids your "semver warrantee".
experimental = ["experimental-api", "testing", "geoip", "conflux"]
conflux = ["__is_experimental", "tor-proto/conflux"]
geoip = [
    "tor-geoip",
    "tor-netdir/geoip",
    "tor-relay-selection/geoip",
    "__is_experimental",
]
experimental-api = ["visibility", "__is_experimental"]
send-control-msg = ["tor-proto/send-control-msg"]
hs-client = ["hs-common"]
hs-service = ["hs-common", "tor-proto/hs-service"]
hs-common = []
__is_experimental = []

[dependencies]
amplify = { version = "4", default-features = false, features = ["derive"] }
async-trait = "0.1.92"
cfg-if = "1.0.5"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_builder = { version = "0.11.2", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
downcast-rs = "2.0.2"
dyn-clone = "1.0.20"
educe = "0.4.23"
futures = "0.3.34"
humantime-serde = "1.1.1"
itertools = "0.15.0"
once_cell = "1"
oneshot-fused-workaround = { path = "../oneshot-fused-workaround", version = "0.8.0-zakura.1", package = "zakura-oneshot-fused-workaround" }
pin-project = "1"
rand = "0.10.3"
retry-error = { path = "../retry-error", version = "0.14.0-zakura.1", package = "zakura-retry-error" }
safelog = { path = "../safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tor-async-utils = { version = "0.47.0-zakura.1", path = "../tor-async-utils", package = "zakura-tor-async-utils" }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-cell = { path = "../tor-cell", version = "0.47.0-zakura.1", package = "zakura-tor-cell" }
tor-chanmgr = { path = "../tor-chanmgr", version = "0.47.0-zakura.1", package = "zakura-tor-chanmgr" }
tor-config = { path = "../tor-config", version = "0.47.0-zakura.1", default-features = false, package = "zakura-tor-config" }
tor-dircommon = { path = "../tor-dircommon", version = "0.47.0-zakura.1", package = "zakura-tor-dircommon" }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", features = ["tracing"], package = "zakura-tor-error" }
tor-geoip = { path = "../tor-geoip", version = "0.47.0-zakura.1", optional = true, package = "zakura-tor-geoip" }
tor-guardmgr = { path = "../tor-guardmgr", version = "0.47.0-zakura.1", package = "zakura-tor-guardmgr" }
tor-linkspec = { path = "../tor-linkspec", version = "0.47.0-zakura.1", package = "zakura-tor-linkspec" }
tor-memquota = { version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false, package = "zakura-tor-memquota" }
tor-netdir = { path = "../tor-netdir", version = "0.47.0-zakura.1", package = "zakura-tor-netdir" }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0-zakura.1", package = "zakura-tor-netdoc" }
tor-persist = { path = "../tor-persist", version = "0.47.0-zakura.1", package = "zakura-tor-persist" }
tor-proto = { path = "../tor-proto", version = "0.47.0-zakura.1", package = "zakura-tor-proto" }
tor-protover = { path = "../tor-protover", version = "0.47.0-zakura.1", package = "zakura-tor-protover" }
tor-relay-selection = { path = "../tor-relay-selection", version = "0.47.0-zakura.1", package = "zakura-tor-relay-selection" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0-zakura.1", package = "zakura-tor-rtcompat" }
tor-units = { path = "../tor-units", version = "0.47.0-zakura.1", package = "zakura-tor-units" }
tracing = "0.1.44"
visibility = { version = "0.1.1", optional = true }
void = "1.0"
weak-table = "0.4.0"
web-time-compat = { path = "../web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }

[dev-dependencies]
futures-await-test = "0.3.0"
hex = "0.4"
tor-guardmgr = { path = "../tor-guardmgr", version = "0.47.0-zakura.1", features = ["testing", "vanguards"], package = "zakura-tor-guardmgr" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", package = "zakura-tor-llcrypto" }
tor-netdir = { path = "../tor-netdir", version = "0.47.0-zakura.1", features = ["testing"], package = "zakura-tor-netdir" }
tor-persist = { path = "../tor-persist", version = "0.47.0-zakura.1", features = ["testing"], package = "zakura-tor-persist" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0-zakura.1", features = ["tokio", "native-tls"], package = "zakura-tor-rtcompat" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0-zakura.1", package = "zakura-tor-rtmock" }
[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_circmgr"
