[package]
name = "zakura-tor-key-forge"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc."]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Low level cryptography wrappers used by Tor"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
full = [
    "tor-error/full",
    "tor-llcrypto/full",
    "tor-cert/full",
    "tor-bytes/full",
    "tor-checkable/full",
]

__is_nonadditive = []
__is_experimental = []

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
paste = "1.0.15"
rand = "0.10.3"
rsa = "0.9.10"
signature = "2"
ssh-key = { version = "0.6.7", package = "ssh-key-fork-arti", features = ["std", "rsa"] }
thiserror = "2"
tor-bytes = { path = "../tor-bytes", version = "0.47.0-zakura.1", default-features = false, package = "zakura-tor-bytes" }
tor-cert = { path = "../tor-cert", version = "0.47.0-zakura.1", features = ["experimental-api"], package = "zakura-tor-cert" }
tor-checkable = { path = "../tor-checkable", version = "0.47.0-zakura.1", package = "zakura-tor-checkable" }
tor-error = { version = "0.47.0-zakura.1", path = "../tor-error", package = "zakura-tor-error" }
tor-llcrypto = { version = "0.47.0-zakura.1", path = "../tor-llcrypto", package = "zakura-tor-llcrypto" }

[dev-dependencies]
signature = "2"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-llcrypto = { version = "0.47.0-zakura.1", path = "../tor-llcrypto", features = ["testing"], package = "zakura-tor-llcrypto" }

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_key_forge"
