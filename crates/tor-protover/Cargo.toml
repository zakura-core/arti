[package]
name = "zakura-tor-protover"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Implementation for Tor's subprotocol versioning"
keywords = ["tor", "arti"]
categories = ["network-programming"]
repository = "https://github.com/zakura-core/arti"

[dependencies]
caret = { package = "zakura-caret", path = "../caret", version = "0.11.0-zakura.1" }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
itertools = "0.15.0"
paste = "1.0.15"
serde_core = { version = "1.0.229", default-features = false, features = ["alloc"], optional = true }
thiserror = "2"
tor-basic-utils = { package = "zakura-tor-basic-utils", path = "../tor-basic-utils", version = "0.47.0-zakura.1" }
tor-bytes = { package = "zakura-tor-bytes", path = "../tor-bytes", version = "0.47.0-zakura.1", optional = true }

[dev-dependencies]
serde_test = "1.0.177"

[features]
default = []
full = ["caret/full", "serde", "tor-bytes", "tor-bytes?/full", "tor-basic-utils/full"]
serde = ["dep:serde_core"]
tor-bytes = ["dep:tor-bytes"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_protover"
