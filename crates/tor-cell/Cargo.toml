[package]
name = "zakura-tor-cell"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Encode and decode Tor cells and messages"
keywords = ["tor", "arti", "protocol"]
categories = ["parser-implementations", "network-programming"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
conflux = ["__is_experimental"]

experimental = ["experimental-udp", "hs", "conflux", "testing"]
# Enable experimental UDP support.
experimental-udp = ["__is_experimental"]

# "hs" = (all) hidden service support, either client or server
hs = ["tor-hscrypto", "__is_experimental"]

# Enable testing only API
testing = ["experimental-udp", "__is_experimental"]


# Support for relay-only operations
relay = []

full = [
    "caret/full",
    "relay",
    "tor-basic-utils/full",
    "tor-bytes/full",
    "tor-cert/full",
    "tor-error/full",
    "tor-hscrypto?/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-memquota/full",
    "tor-protover/full",
    "tor-units/full",
]
__is_experimental = []

[dependencies]
bitflags = "2"
bytes = "1"
caret = { path = "../caret", version = "0.11.0-zakura.1", package = "zakura-caret" }
derive-deftly = "~1.14.0"
derive_more = { version = "2.1.1", features = ["full"] }
educe = "0.4.23"
getset = "0.1.7"
itertools = "0.15.0"
paste = "1.0.15"
rand = "0.10.3"
smallvec = "1.16"
thiserror = "2"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-bytes = { path = "../tor-bytes", version = "0.47.0-zakura.1", package = "zakura-tor-bytes" }
tor-cert = { path = "../tor-cert", version = "0.47.0-zakura.1", package = "zakura-tor-cert" }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-hscrypto = { path = "../tor-hscrypto", version = "0.47.0-zakura.1", optional = true, features = ["memquota-memcost"], package = "zakura-tor-hscrypto" }
tor-linkspec = { path = "../tor-linkspec", version = "0.47.0-zakura.1", package = "zakura-tor-linkspec" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", features = ["memquota-memcost"], package = "zakura-tor-llcrypto" }
tor-memquota = { version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false, package = "zakura-tor-memquota" }
tor-protover = { path = "../tor-protover", version = "0.47.0-zakura.1", features = ["tor-bytes"], package = "zakura-tor-protover" }
tor-units = { path = "../tor-units", version = "0.47.0-zakura.1", features = ["memquota-memcost"], package = "zakura-tor-units" }
void = "1"

[dev-dependencies]
hex = "0.4"
hex-literal = "1.1"
[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_cell"
