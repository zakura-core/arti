[package]
name = "zakura-tor-socksproto"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Encode and decode the SOCKS protocol, as extended in Tor"
keywords = ["tor", "arti", "socks"]
categories = ["network-programming"]
repository = "https://github.com/zakura-core/arti"

[features]
default = ["proxy-handshake"]

client-handshake = []
proxy-handshake = []

full = [
    "proxy-handshake",
    "client-handshake",
    "caret/full",
    "tor-bytes/full",
    "tor-error/full",
    "safelog/full",
]

[dependencies]
arbitrary = { version = "1.5.0", optional = true, features = ["derive"] }
caret = { package = "zakura-caret", path = "../caret", version = "0.11.0-zakura.1" }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
educe = "0.4.23"
safelog = { package = "zakura-safelog", path = "../safelog", version = "0.10.0-zakura.1" }
subtle = "2"
thiserror = "2"
tor-bytes = { package = "zakura-tor-bytes", path = "../tor-bytes", version = "0.47.0-zakura.1", default-features = false }
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1", default-features = false }

[dev-dependencies]
anyhow = "1.0.104"
hex-literal = "1.1"
[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_socksproto"
