[package]
name = "zakura-tor-cert-x509"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "X509 certificates as used by Tor"
keywords = ["tor", "arti", "certificate"]
categories = ["parser-implementations"]
repository = "https://github.com/zakura-core/arti"

[package.metadata.docs.rs]
all-features = true

[features]
default = []

full = ["tor-error/full", "tor-llcrypto/full"]

[dependencies]

digest = "0.10.7"
ecdsa = { version = "0.16.9", features = ["der", "pkcs8", "signing", "verifying"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
pem = { version = "3" }
rand = { version = "0.10.3" }
rsa = { version = "0.9.10", features = ["sha2"] }
thiserror = "2"
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", features = ["rng-compat"], package = "zakura-tor-llcrypto" }
x509-cert = { version = "0.2.5", features = ["builder", "hazmat"] }

[dev-dependencies]
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
web-time-compat = { path = "../web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }

[lib]
name = "tor_cert_x509"
