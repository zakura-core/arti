[package]
name = "zakura-saturating-time"
version = "0.5.0-zakura.1"
authors = ["The Tor Project, Inc.", "Clara Engler <cve@torproject.org>"]
edition = "2024"
rust-version = "1.92"
description = "A trait for limits and saturations on types inside std::time"
repository = "https://github.com/zakura-core/arti"
license = "MIT OR Apache-2.0"
keywords = ["time", "system-time", "instant", "saturating"]
categories = ["date-and-time", "os", "rust-patterns"]

[dependencies]
web-time-compat = { version = "0.3.0-zakura.1", path = "../web-time-compat", package = "zakura-web-time-compat" }

[features]
full = ["web-time-compat/full"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "saturating_time"
