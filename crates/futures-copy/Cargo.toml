[package]
name = "zakura-futures-copy"
version = "0.5.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Copy data between AsyncRead and AsyncWrite, with bidirectional and flushing support"
keywords = ["futures", "tor", "arti"]
# We must put *something* here and this will do
categories = ["rust-patterns", "network-programming"]
repository = "https://github.com/zakura-core/arti"

[features]
full = []

[dependencies]
extend = "1.2.0"
futures = "0.3.34"
pin-project = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-rtcompat = { version = "0.47.0-zakura.1", path = "../tor-rtcompat", package = "zakura-tor-rtcompat" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0-zakura.1", package = "zakura-tor-rtmock" }

[package.metadata.docs.rs]
all-features = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[lib]
name = "futures_copy"
