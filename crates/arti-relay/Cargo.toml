[package]
name = "zakura-arti-relay"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc."]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Library for running a relay of the Tor network"
keywords = ["tor", "arti", "privacy", "anonymity", "networking"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/zakura-core/arti"

[package.metadata.docs.rs]
all-features = true

[features]
full = [
    "fs-mistrust/full",
    "safelog/full",
    "tor-async-utils/full",
    "tor-chanmgr/full",
    "tor-config/full",
    "tor-error/full",
    "tor-keymgr/full",
    "tor-netdir/full",
    "tor-netdoc/full",
    "tor-proto/full",
    "tor-relay-crypto/full",
    "tor-rtcompat/full",
    "tor-memquota/full",
    "tor-config-path/full",
    "tor-llcrypto/full",
    "tor-persist/full",
    "tor-general-addr/full",
    "tor-circmgr/full",
    "tor-dircommon/full",
    "tor-dirclient/full",
    "tor-dirmgr/full",
    "tor-dirpublish/full",
    "tor-guardmgr/full",
    "tor-log-ratelim/full",
    "tor-basic-utils/full",
    "tor-cert/full",
    "tor-key-forge/full",
    "tor-units/full",
    "web-time-compat/full",
    "tor-cell/full",
    "tor-dirserver/full",
    "otlp-file-exporter?/full",
    "tor-config-shared/full",
]

# This feature flag enables experimental features that are not supported. Turning it on may
# void your API.
experimental = ["metrics", "opentelemetry"]

metrics = ["tor-chanmgr/metrics", "dep:metrics-exporter-prometheus", "__is_experimental"]
opentelemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:otlp-file-exporter",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-proto",
    "__is_experimental",
]
__is_experimental = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64ct = "1.8.3"
cfg-if = "1.0.5"
clap = { version = "4.6.7", features = ["string", "wrap_help", "derive"] }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
directories = "6"
either = "1.19.0"
fs-mistrust = { path = "../fs-mistrust", version = "0.16.0-zakura.1", features = ["serde"], package = "zakura-fs-mistrust" }
futures = "0.3.34"
hickory-net = "0.26.3"
hickory-proto = "0.26.3"
hickory-resolver = "0.26.3"
libc = "0.2"
metrics-exporter-prometheus = { version = "0.18.3", optional = true, default-features = false, features = [
    "http-listener",
] }
oneshot-fused-workaround = { path = "../oneshot-fused-workaround", version = "0.8.0-zakura.1", package = "zakura-oneshot-fused-workaround" }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true }
opentelemetry-proto = { version = "0.33.1", optional = true }
# TODO: Figure out why this feature is needed, and how it interacts with non-tokio runtimes.
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"], optional = true }
otlp-file-exporter = { path = "../otlp-file-exporter", version = "0.2.0-zakura.1", optional = true, package = "zakura-otlp-file-exporter" }
rand = "0.10.3"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "aws_lc_rs"] }
safelog = { path = "../safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.16"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["signal"] }
tor-async-utils = { path = "../tor-async-utils", version = "0.47.0-zakura.1", package = "zakura-tor-async-utils" }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-cell = { path = "../tor-cell", version = "0.47.0-zakura.1", features = ["relay"], package = "zakura-tor-cell" }
tor-cert = { path = "../tor-cert", version = "0.47.0-zakura.1", package = "zakura-tor-cert" }
tor-chanmgr = { path = "../tor-chanmgr", version = "0.47.0-zakura.1", features = ["relay"], package = "zakura-tor-chanmgr" }
tor-circmgr = { version = "0.47.0-zakura.1", path = "../tor-circmgr", package = "zakura-tor-circmgr" }
tor-config = { path = "../tor-config", version = "0.47.0-zakura.1", default-features = false, features = ["load-config"], package = "zakura-tor-config" }
tor-config-path = { path = "../tor-config-path", version = "0.47.0-zakura.1", package = "zakura-tor-config-path" }
tor-config-shared = { path = "../tor-config-shared", version = "0.47.0-zakura.1", package = "zakura-tor-config-shared" }
tor-dirclient = { version = "0.47.0-zakura.1", path = "../tor-dirclient", features = ["relay"], package = "zakura-tor-dirclient" }
tor-dircommon = { version = "0.47.0-zakura.1", path = "../tor-dircommon", package = "zakura-tor-dircommon" }
tor-dirmgr = { path = "../tor-dirmgr", version = "0.47.0-zakura.1", features = ["dir-plugin"], package = "zakura-tor-dirmgr" }
tor-dirpublish = { path = "../tor-dirpublish", version = "0.47.0-zakura.1", package = "zakura-tor-dirpublish" }
tor-dirserver = { path = "../tor-dirserver", version = "0.47.0-zakura.1", features = ["dir-plugin-backend"], package = "zakura-tor-dirserver" }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-general-addr = { path = "../tor-general-addr", version = "0.47.0-zakura.1", package = "zakura-tor-general-addr" }
tor-guardmgr = { version = "0.47.0-zakura.1", path = "../tor-guardmgr", package = "zakura-tor-guardmgr" }
tor-key-forge = { version = "0.47.0-zakura.1", path = "../tor-key-forge", package = "zakura-tor-key-forge" }
tor-keymgr = { path = "../tor-keymgr", version = "0.47.0-zakura.1", features = ["keymgr", "experimental-api"], package = "zakura-tor-keymgr" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", package = "zakura-tor-llcrypto" }
tor-log-ratelim = { path = "../tor-log-ratelim", version = "0.47.0-zakura.1", package = "zakura-tor-log-ratelim" }
tor-memquota = { version = "0.47.0-zakura.1", path = "../tor-memquota", package = "zakura-tor-memquota" }
tor-netdir = { path = "../tor-netdir", version = "0.47.0-zakura.1", package = "zakura-tor-netdir" }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0-zakura.1", package = "zakura-tor-netdoc" }
tor-persist = { path = "../tor-persist", version = "0.47.0-zakura.1", features = ["state-dir"], package = "zakura-tor-persist" }
tor-proto = { path = "../tor-proto", version = "0.47.0-zakura.1", features = ["tokio"], package = "zakura-tor-proto" }
tor-relay-crypto = { path = "../tor-relay-crypto", version = "0.47.0-zakura.1", package = "zakura-tor-relay-crypto" }
tor-rtcompat = { path = "../tor-rtcompat", version = "0.47.0-zakura.1", features = ["rustls", "tokio", "tls-server"], package = "zakura-tor-rtcompat" }
tor-units = { path = "../tor-units", version = "0.47.0-zakura.1", package = "zakura-tor-units" }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
void = "1"
web-time-compat = { path = "../web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }

[dev-dependencies]
tor-keymgr = { path = "../tor-keymgr", version = "0.47.0-zakura.1", features = ["ephemeral-keystore", "testing"], package = "zakura-tor-keymgr" }
tor-rtmock = { path = "../tor-rtmock", version = "0.47.0-zakura.1", package = "zakura-tor-rtmock" }

[[bin]]
name = "arti-relay"
path = "src/main.rs"
