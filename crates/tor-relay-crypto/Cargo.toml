[package]
name = "zakura-tor-relay-crypto"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc."]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Cryptography types and helpers for a Tor relay"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
full = [
    "tor-cert/full",
    "tor-key-forge/full",
    "tor-keymgr/full",
    "tor-error/full",
    "tor-persist/full",
    "tor-checkable/full",
    "tor-llcrypto/full",
    "web-time-compat/full",
]

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
humantime = "2"
tor-cert = { path = "../tor-cert", version = "0.47.0-zakura.1", package = "zakura-tor-cert" }
tor-checkable = { path = "../tor-checkable", version = "0.47.0-zakura.1", package = "zakura-tor-checkable" }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", package = "zakura-tor-error" }
tor-key-forge = { path = "../tor-key-forge", version = "0.47.0-zakura.1", package = "zakura-tor-key-forge" }
tor-keymgr = { path = "../tor-keymgr", version = "0.47.0-zakura.1", features = ["experimental-api"], package = "zakura-tor-keymgr" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", package = "zakura-tor-llcrypto" }
tor-persist = { path = "../tor-persist", version = "0.47.0-zakura.1", package = "zakura-tor-persist" }
web-time-compat = { path = "../web-time-compat", version = "0.3.0-zakura.1", package = "zakura-web-time-compat" }

[dev-dependencies]
tor-keymgr = { version = "0.47.0-zakura.1", path = "../tor-keymgr", features = ["testing"], package = "zakura-tor-keymgr" }

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_relay_crypto"
