[package]
name = "zakura-tor-relay-crypto"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc."]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Cryptography types and helpers for a Tor relay"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
full = [
    "tor-cert/full",
    "tor-key-forge/full",
    "tor-keymgr/full",
    "tor-error/full",
    "tor-persist/full",
    "tor-checkable/full",
    "tor-llcrypto/full",
    "web-time-compat/full",
]

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
humantime = "2"
tor-cert = { package = "zakura-tor-cert", path = "../tor-cert", version = "0.47.0-zakura.1" }
tor-checkable = { package = "zakura-tor-checkable", path = "../tor-checkable", version = "0.47.0-zakura.1" }
tor-error = { package = "zakura-tor-error", path = "../tor-error", version = "0.47.0-zakura.1" }
tor-key-forge = { package = "zakura-tor-key-forge", path = "../tor-key-forge", version = "0.47.0-zakura.1" }
tor-keymgr = { package = "zakura-tor-keymgr", path = "../tor-keymgr", version = "0.47.0-zakura.1", features = ["experimental-api"] }
tor-llcrypto = { package = "zakura-tor-llcrypto", path = "../tor-llcrypto", version = "0.47.0-zakura.1" }
tor-persist = { package = "zakura-tor-persist", path = "../tor-persist", version = "0.47.0-zakura.1" }
web-time-compat = { package = "zakura-web-time-compat", path = "../web-time-compat", version = "0.3.0-zakura.1" }

[dev-dependencies]
tor-keymgr = { package = "zakura-tor-keymgr", version = "0.47.0-zakura.1", path = "../tor-keymgr", features = ["testing"] }

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_relay_crypto"
