[package]
name = "zakura-tor-linkspec"
version = "0.47.0-zakura.1"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Parts of the Tor protocol that indicate specific relays on the network"
keywords = ["tor", "arti"]
categories = ["network-programming"]
repository = "https://github.com/zakura-core/arti"

[features]
default = []
full = [
    "pt-client",
    "caret/full",
    "safelog/full",
    "tor-basic-utils/full",
    "tor-bytes/full",
    "tor-config/full",
    "tor-llcrypto/full",
    "tor-protover/full",
    "tor-memquota/full",
]
experimental = ["decode", "verbatim"]
pt-client = []
decode = ["__is_experimental"]
verbatim = ["__is_experimental"]
__is_experimental = []

[dependencies]
base64ct = "1.8.3"
by_address = "1"
caret = { path = "../caret", version = "0.11.0-zakura.1", package = "zakura-caret" }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_builder = { version = "0.11.2", package = "derive_builder_fork_arti" }
derive_more = { version = "2.1.1", features = ["full"] }
hex = "0.4"
itertools = "0.15.0"
safelog = { path = "../safelog", version = "0.10.0-zakura.1", package = "zakura-safelog" }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-bytes = { path = "../tor-bytes", version = "0.47.0-zakura.1", package = "zakura-tor-bytes" }
tor-config = { path = "../tor-config", version = "0.47.0-zakura.1", default-features = false, package = "zakura-tor-config" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", features = ["memquota-memcost"], package = "zakura-tor-llcrypto" }
tor-memquota = { version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false, package = "zakura-tor-memquota" }
tor-protover = { path = "../tor-protover", version = "0.47.0-zakura.1", package = "zakura-tor-protover" }

[dev-dependencies]
hex-literal = "1.1"
itertools = "0.15.0"
serde_test = "1.0.177"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_linkspec"
