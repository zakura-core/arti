[package]
name = "tor-netdoc"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Network document formats used with the Tor protocols."
keywords = ["tor", "arti"]
categories = ["parser-implementations"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[features]
default = []

full = [
    "encode",
    "hs-client",
    "tor-basic-utils/full",
    "tor-bytes/full",
    "tor-cert/full",
    "tor-checkable/full",
    "tor-error/full",
    "tor-hscrypto?/full",
    "tor-linkspec?/full",
    "tor-llcrypto/full",
    "tor-protover/full",
    "tor-units?/full",
    "tor-cell/full",
    "web-time-compat/full",
]
experimental = [
    "build_docs",
    "experimental-api",
    "incomplete",
    "hs-dir",
    "retain-unknown",
]

build_docs = ["__is_experimental"]
encode = []
incomplete = ["encode", "__is_experimental"]
testing = ["hex-literal", "visibility", "dep:imara-diff", "dep:regex"]

# Client-side and directory-side support for onion services.
# Experimental: not covered by semver guarantees.
# TODO hs: mark these as part of "full" once they are done and stable.
hs-dir = ["hs-common", "__is_experimental"]

# TODO unconditionally enable `hs-client` and `hs-common` (de-cfg-gate all items).
# These are "document type" features in #2492's taxonomy but that ticket didn't mention them
# by name, so we should have another consensus call for those.
hs-client = ["hs-common"]
hs-common = ["tor-hscrypto", "tor-linkspec", "tor-units"]

retain-unknown = ["__is_experimental"]

# Enable experimental APIs that are not yet officially supported.
#
# These APIs are not covered by semantic versioning.  Using this
# feature voids your "semver warrantee".
experimental-api = ["testing", "__is_experimental"]

__is_experimental = []

[dependencies]
arrayvec = "0.7.8"
base64ct = { version = "1.8.3", features = ["alloc"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
derive_more = { version = "2.1.1", features = ["full"] }
digest = "0.10.7"
educe = "0.4.23"
extend = "1.2.0"
getset = "0.1.7"
hex = "0.4"
hex-literal = { version = "1.1", optional = true }
hostname-validator = "1.1.1"
humantime = "2"
imara-diff = { version = "0.2.0", optional = true }
ipnet = "2"
iprange = "0.6.7"
itertools = "0.15.0"
memchr = "2.8"
paste = "1.0.15"
rand = { version = "0.10.3" }
rangemap = "1.8"
regex = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
signature = "2"
smallvec = "1.16"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3.55", features = ["std", "parsing", "macros", "formatting"] }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0" }
tor-bytes = { path = "../tor-bytes", version = "0.47.0" }
tor-cell = { path = "../tor-cell", version = "0.47.0" }
tor-cert = { path = "../tor-cert", version = "0.47.0" }
tor-checkable = { path = "../tor-checkable", version = "0.47.0" }
tor-error = { path = "../tor-error", version = "0.47.0" }
tor-hscrypto = { path = "../tor-hscrypto", version = "0.47.0", optional = true }
tor-linkspec = { path = "../tor-linkspec", version = "0.47.0", optional = true }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0", features = ["cvt-x25519"] }
tor-protover = { path = "../tor-protover", version = "0.47.0", features = ["serde"] }
tor-units = { version = "0.47.0", path = "../tor-units", optional = true }
visibility = { version = "0.1.1", optional = true }
void = "1"
web-time-compat = { version = "0.3.0", path = "../web-time-compat" }
zeroize = "1"

[dev-dependencies]
serde_test = "1.0.177"
anyhow = "1.0.104"
assert_matches = "1.5.0"
hex-literal = "1.1"
imara-diff = "0.2.0"
itertools = "0.15.0"
pem = "3.0.6"
regex = "1"
serde_json = "1.0.154"
testresult = "0.4.2"
tor-basic-utils = { version = "0.47.0", path = "../tor-basic-utils" }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(saturating_time_nightly)"] }
