[package]
name = "zakura-tor-units"
version = "0.47.0-zakura.1"
authors = ["Dennis Jackson <git@dennisjj.co.uk>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Provides macros for types which are constrained within a range, ensuring invalid values are unrepresentable."
keywords = ["tor", "arti"]
repository = "https://github.com/zakura-core/arti"
categories = ["rust-patterns"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
derive-deftly = { version = "~1.14.0", optional = true }
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tor-memquota = { package = "zakura-tor-memquota", version = "0.47.0-zakura.1", path = "../tor-memquota", default-features = false, optional = true }

[dev-dependencies]
float-cmp = "0.10.0"

[features]
full = ["memquota-memcost", "tor-memquota?/full"]
memquota-memcost = ["derive-deftly", "tor-memquota"]

# [derive_more]
# default-features = false
# features = ["from"]
[package.metadata.docs.rs]
all-features = true

[lib]
name = "tor_units"
