[package]
name = "zakura-tor-dircommon"
version = "0.47.0-zakura.1"
authors = [
    "The Tor Project, Inc.",
    "Nick Mathewson <nickm@torproject.org>",
    "Clara Engler <cve@torproject.org>",
]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Common primitives for the Tor directory specification"
keywords = ["tor", "arti", "download", "async"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/zakura-core/arti"

[package.metadata.docs.rs]
all-features = true

[features]
full = [
    "tor-basic-utils/full",
    "tor-checkable/full",
    "tor-config/full",
    "tor-linkspec/full",
    "tor-llcrypto/full",
    "tor-netdoc/full",
    "tor-error?/full",
]

experimental = ["dir-plugin-backend"]

dir-plugin-backend = ["__is_experimental", "dep:http", "dep:thiserror", "dep:tor-error"]
__is_experimental = []

[dependencies]
base64ct = "1.8.3"
derive-deftly = { version = "~1.14.0", features = ["full", "beta"] }
getset = "0.1.7"
http = { version = "1.5.0", optional = true }
humantime = "2"
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { version = "2", optional = true }
tor-basic-utils = { path = "../tor-basic-utils", version = "0.47.0-zakura.1", package = "zakura-tor-basic-utils" }
tor-checkable = { path = "../tor-checkable", version = "0.47.0-zakura.1", package = "zakura-tor-checkable" }
tor-config = { path = "../tor-config", version = "0.47.0-zakura.1", default-features = false, package = "zakura-tor-config" }
tor-error = { path = "../tor-error", version = "0.47.0-zakura.1", optional = true, package = "zakura-tor-error" }
tor-linkspec = { path = "../tor-linkspec", version = "0.47.0-zakura.1", package = "zakura-tor-linkspec" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.47.0-zakura.1", package = "zakura-tor-llcrypto" }
tor-netdoc = { path = "../tor-netdoc", version = "0.47.0-zakura.1", package = "zakura-tor-netdoc" }
tracing = "0.1.44"

[dev-dependencies]
toml = "1.1.8"

[lib]
name = "tor_dircommon"
